data:
  raw_pubmed_path: data/raw/pubmed_article.json
  processed_documents_path: data/processed/documents.jsonl
  chunks_path: data/processed/chunks.jsonl

chunking:
  chunk_size: 512
  chunk_overlap: 80
  min_chunk_chars: 100

embedding:
  provider: huggingface
  model_name: BAAI/bge-large-en-v1.5
  device: auto
  batch_size: 16
  normalize_embeddings: true

vector_store:
  provider: chroma
  persist_dir: indexes/chroma
  collection_name: pubmed_articles

retrieval:
  top_k: 15

reranking:
  enabled: true
  provider: bge
  model_name: BAAI/bge-reranker-base
  device: auto
  top_k: 4

llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.1
  max_output_tokens: 800

safety:
  medical_disclaimer: true
  block_personalized_medical_advice: true

logging:
  level: INFO
